<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>dither-ui: a dithered UI toolkit for Vue</title>
    <meta
      name="description"
      content="dither-ui is a Vue 3 UI toolkit of 264 components drawn pixel by pixel from one seeded palette: charts, controls, forms, overlays, backgrounds, text effects, 3D models and shaders. A Svelte 5 port, a live docs section for every component and a Studio your coding agent can drive. MIT licensed."
    />
    <meta
      name="keywords"
      content="dither, dithering, Vue, Vue 3, UI toolkit, component library, charts, canvas, pixel art, ordered dither, Bayer, seed-generative, shadcn, Base UI, data visualization"
    />
    <meta name="author" content="dither-ui" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://dither-ui.com/" />

    <!-- Discord / Chrome address-bar accent (the embed's coloured side bar) -->
    <meta name="theme-color" content="#3f8ff3" />

    <!-- Icons -->
    <link rel="icon" href="<%= assetPrefix %>/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="<%= assetPrefix %>/favicon.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="<%= assetPrefix %>/apple-touch-icon.png" />

    <!-- Open Graph (Discord, Facebook, LinkedIn, Slack, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="dither-ui" />
    <meta property="og:title" content="dither-ui: a dithered UI toolkit for Vue" />
    <meta
      property="og:description"
      content="264 Vue components drawn pixel by pixel from one seeded palette, with live docs and a Studio your coding agent can drive. MIT licensed."
    />
    <meta property="og:url" content="https://dither-ui.com/" />
    <meta property="og:image" content="https://dither-ui.com/og/home.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="dither-ui over two dithered horizons, blue and purple, under a few stars"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="dither-ui: a dithered UI toolkit for Vue" />
    <meta
      name="twitter:description"
      content="264 Vue components drawn pixel by pixel from one seeded palette, with live docs and a Studio your coding agent can drive. MIT licensed."
    />
    <meta name="twitter:image" content="https://dither-ui.com/og/home.png" />
    <meta
      name="twitter:image:alt"
      content="dither-ui over two dithered horizons, blue and purple, under a few stars"
    />
    <!-- Discord plays the card in its component embed; oEmbed readers (Slack first) take the playing card as a photo -->
    <link rel="discord:component-embed" type="application/json" href="https://dither-ui.com/embed/home.json" />
    <link rel="alternate" type="application/json+oembed" href="https://dither-ui.com/oembed/home.json" title="dither-ui" />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "dither-ui",
        "description": "A Vue 3 UI toolkit of 264 components drawn pixel by pixel from one seeded palette, with a Svelte 5 port, live docs and a Studio your coding agent can drive.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "url": "https://dither-ui.com/",
        "image": "https://dither-ui.com/og/home.png",
        "license": "https://opensource.org/licenses/MIT",
        "author": { "@type": "Organization", "name": "dither-ui" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
