name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # The framework-free code (the engine, the site's shared modules, the
  # scripts) and the whole repository's lint and formatting, on the Rstack
  # CLI. Its types are checked with the site's, in the job below.
  root:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npx rs fmt --check
      - name: Unit tests
        run: npm test

  # The site and the kit's Solid layer (SolidStart needs Node 24; the kit's
  # own dependencies and the shared modules' resolve from the root install).
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            solid-site/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: solid-site
      # one program: the site, the kit, the engine, the shared modules, the
      # scripts and every spec, the root's included
      - name: Typecheck
        run: npm run check
        working-directory: solid-site
      # the sandbox spec runs in the runner's Chromium
      - name: Component tests
        run: npm test
        working-directory: solid-site
      # the build ends by drawing the share cards in the runner's Chromium
      - name: Static build
        run: npm run build
        working-directory: solid-site
      - name: Tests over the built site
        run: npm test
        working-directory: solid-site

  # The Svelte port of the kit and its showcase site.
  svelte:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dither-kit-svelte/package-lock.json
            svelte-site/package-lock.json
      - run: npm ci
        working-directory: dither-kit-svelte
      - name: Check the kit
        run: npm run check
        working-directory: dither-kit-svelte
      - run: npm ci
        working-directory: svelte-site
      - name: Check the site
        run: npm run check
        working-directory: svelte-site
      - name: Build the site
        run: npx rs build
        working-directory: svelte-site
