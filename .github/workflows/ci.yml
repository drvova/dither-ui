name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npx rs fmt --check
      - name: Typecheck
        run: npx vue-tsc --noEmit
      - name: Unit tests
        run: npm test
      # rs build makes the site and the single-file player bundle together.
      - name: Build
        run: npx rs build
