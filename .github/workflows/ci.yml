name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # One install at the workspace root, on the one Node (24, which SolidStart
  # needs): the whole repository's lint and formatting, its types, every
  # package's framework-free specs (Rstest) and the kit's component specs.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npx rs fmt --check
      # one program: every package's source, build files and specs
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npx rs test
      - name: Kit component tests
        run: npm test -w dither-kit

  # The site: its component specs, the static build, and the specs again
  # over the built site.
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # the sandbox spec runs in the runner's Chromium
      - name: Component tests
        run: npm test -w site
      # the build ends by drawing the share cards in the runner's Chromium
      - name: Static build
        run: npm run build
      - name: Tests over the built site
        run: npm test -w site
