name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vue-tsc --noEmit
      # The site and the single-file player the video export inlines
      # (dist/play/player.js), in one rs build.
      - run: npx rs build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
      - run: npm run build:css
      # Unknown paths get the bare app shell (copied before the snapshots
      # land), which routes them itself.
      - name: Prepare Pages artifact
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      # The crawler surface: /, /docs and /studio as static DOM (the first
      # paint, before the app mounts), the hero film's poster, the agent
      # registry, and an og card and a page per docs section. Its server
      # serves dist at /, so the
      # project-URL deploy (BASE_PATH=/dither-ui/) ships the shell only.
      - name: Prerender
        if: ${{ (vars.BASE_PATH || '/') == '/' }}
        run: node scripts/prerender.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
