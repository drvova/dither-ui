name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # reads the repository and the Pages settings; writes nothing
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # One install at the workspace root, on the one Node (24, which
      # SolidStart needs).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The whole site as static files in packages/site/.output/public:
      # every page prerendered (404.html among them, which a static host
      # serves for an unknown address), the single-file player the video
      # export inlines, the Studio's worker, the crawler files, then the
      # post-build in the runner's Chromium: the kit stylesheet, a share
      # card a page and the agent registry. `/` on dither-ui.com (the
      # site's public/CNAME); BASE_PATH=/dither-ui/ only for a project-URL
      # deploy.
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
      # Pages would drop the build's `_build/` folder without it.
      - name: Prepare Pages artifact
        run: touch packages/site/.output/public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
